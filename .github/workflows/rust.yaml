name: Rust

on:
  push:
    branches:
      - main
      - develop
      - ci/*
      - feat/*
      - feature/*
      - fix/*
      - hotfix/*
      - release/*

  pull_request:
    paths:
      - "**/src/**"
      - ".github/**"
      - Cargo.lock
      - Cargo.toml
      - deny.toml
      - flake.lock
      - rust-toolchain.toml
      - rustfmt.toml

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: true
  RUSTC_WRAPPER: "sccache"

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt:
    name: Check Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Show rustfmt version
        run: |
          nix develop --command cargo fmt --version

      - name: Run cargo fmt
        run: |
          nix develop --command cargo fmt --all --verbose --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs:
      - rustfmt
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Pre Cache
        run: |
          rm -rf ~/.cargo/registry/index/ ~/.cargo/registry/cache/ ~/.cargo/git/db/ ./target/

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('flake.lock', '**/Cargo.lock') }}

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Show cargo clippy version
        run: |
          nix develop --command cargo clippy --version

      - name: Run cargo clippy
        run: |
          nix develop --command cargo clippy-all

  test:
    name: Test
    runs-on: ubuntu-latest
    needs:
      - clippy

    env:
      NEXTEST_RETRIES: 5
    strategy:
      fail-fast: false
      matrix:
        mode:
          - release
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Pre Cache
        run: |
          rm -rf ~/.cargo/registry/index/ ~/.cargo/registry/cache/ ~/.cargo/git/db/ ./target/

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./target/
          key: ${{ runner.os }}-cargo-${{ matrix.mode }}-${{ hashFiles('flake.lock', '**/Cargo.lock') }}

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Show cargo-nextest version
        run: |
          nix develop --command cargo nextest --version

      - name: Test with cargo-nextest
        run: |
          nix develop --command cargo nextest-all ${{ matrix.mode == 'release' && '--release' || '' }}

  test-macos:
    name: Test (macOS)
    runs-on: macos-15
    needs:
      - clippy

    env:
      NEXTEST_RETRIES: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('flake.lock', '**/Cargo.lock') }}

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Show cargo-nextest version
        run: |
          nix develop --command cargo nextest --version

      - name: Test with cargo-nextest
        run: |
          nix develop --command cargo nextest-all --release

      - name: Run doctests
        run: |
          nix develop --command cargo test --workspace --release --doc

  doc:
    name: Doc
    runs-on: ubuntu-latest
    needs:
      - clippy

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Pre Cache
        run: |
          rm -rf ~/.cargo/registry/index/ ~/.cargo/registry/cache/ ~/.cargo/git/db/ ./target/

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('flake.lock', '**/Cargo.lock') }}

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Run cargo doc
        run: |
          nix develop --command cargo doc-all
